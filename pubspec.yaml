name: cabo_counter
version: 1.1.10+1367
publish_to: none

environment:
  sdk: ^3.13.7
description: Mobile app for the card game Cabo

dependencies:
  collection: ^1.19.1
  confetti: ^0.8.0
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
