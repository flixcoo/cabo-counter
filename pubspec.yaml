name: cabo_counter
version: 1.1.5+1327
publish_to: none

environment:
  sdk: ^3.13.2
description: Mobile app for the card game Cabo

dependencies:
  collection: ^1.18.0
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  drift: ^2.27.0
  drift_flutter: ^0.3.0
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_sficon: ^1.3.0
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0
  intl: any
  json_schema: ^5.2.1
  once: ^1.7.1
  package_info_plus: any
  path_provider: ^2.1.1
  provider: ^6.1.5+1
  rate_my_app: ^2.3.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  shimmer: ^4.0.0
  skeletonizer: ^2.1.3
  syncfusion_flutter_charts: ^34.2.6
  url_launcher: any
  uuid: ^4.5.1

dev_dependencies:
  arb_utils: ^0.11.0
  build_runner: ^2.4.15
  dart_pubspec_licenses: ^3.0.14
  drift_dev: ^2.27.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  remove_unused_localizations: ^1.1.2
  sort_pubspec_dependencies: 0.0.2
  test: ^1.25.15

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app-logo.jpg
    - assets/game_list-schema.json
    - assets/game-schema.json
